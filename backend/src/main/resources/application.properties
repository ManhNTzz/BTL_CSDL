spring.application.name=quanlyktx

# Mac dinh kich hoat profile 'dev' khi chay may ca nhan
spring.profiles.active=dev

# Cong port mac dinh cua du an
server.port=8080

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false

# Dia chi frontend duoc phep goi API (CORS)
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Tu dong mo cua so giao dien dang Desktop App khi khoi dong xong
app.auto-open-window=true


# Nạp cấu hình từ môi trường cho cả Run/F5, không tự sửa cấu trúc CSDL.
spring.datasource.url=jdbc:mysql://${KTX_DB_HOST:127.0.0.1}:${KTX_DB_PORT:3306}/${KTX_DB_NAME:QuanLyKTX}?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=6264
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
server.address=127.0.0.1
